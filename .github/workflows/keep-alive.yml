name: Keep Alive - API Pedidos

on:
  schedule:
    # Ejecuta cada 10 minutos para evitar que Render duerma el servicio
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://pp3-api-pedidos-1.onrender.com/health)
          echo "Health check response: $response"
          if [ "$response" != "200" ]; then
            echo "WARNING: Service returned $response"
            exit 1
          fi
